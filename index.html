<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funktionale Abhängigkeiten – Lernpfad</title>
<style>
:root{--ink:#14213d;--bg:#f6f8fc;--card:#fff;--line:#d3dcee;--acc:#2851d8;--amb:#d97a00;--ok:#1b7f3b;--bad:#b3261e;--mut:#55627d;--soft:#eaf0fd}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf8;--bg:#10162a;--card:#182040;--line:#2b3761;--acc:#7f9cff;--amb:#ffb347;--ok:#5fd07f;--bad:#ff8a80;--mut:#a3aecb;--soft:#1f2a52}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;color:var(--ink);font:17px/1.55 Charter,"Iowan Old Style",Georgia,serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:760px;margin:0 auto;padding:18px 14px 48px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:20px 22px;box-shadow:6px 6px 0 var(--acc)}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 4px}h2{font-size:1.25rem;line-height:1.25;margin:.2em 0 .5em}
.bar{height:8px;background:var(--soft);border:1px solid var(--ink);margin:0 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.meta{font:14px system-ui,sans-serif;color:var(--mut);margin-bottom:6px}
.pl{display:block;max-width:100%;height:auto;margin:12px auto;background:var(--card);border:1px solid var(--line);touch-action:none}
.gr{stroke:var(--line);stroke-width:1}.ax{stroke:var(--ink);stroke-width:1.6}.tk{font:11px system-ui,sans-serif;fill:var(--mut);text-anchor:middle}
.lb{font:600 14px system-ui,sans-serif;fill:var(--ink)}.ol{text-decoration:overline}
.q{font-weight:700;margin:14px 0 8px}
.o{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:9px 12px;margin:7px 0;cursor:pointer}
.o:hover:not(:disabled){background:var(--soft)}.o:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.o.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through;opacity:.8}.o.ok{border-color:var(--ok);background:var(--soft);color:var(--ink);font-weight:700}.o.sel{background:var(--soft);border-color:var(--acc);box-shadow:inset 5px 0 0 var(--acc)}
.fb{font:15px/1.5 system-ui,sans-serif;margin:10px 0;padding:10px 12px;border-left:5px solid var(--bad);background:var(--soft)}.fb.g{border-color:var(--ok)}.tip{border-color:var(--amb)}
.btn{font:600 16px system-ui,sans-serif;background:var(--acc);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:9px 18px;cursor:pointer;margin-top:10px}
@media(prefers-color-scheme:dark){.btn{color:#10162a}}
.btn[hidden]{display:none}.ro{font:15px system-ui,sans-serif;background:var(--soft);padding:8px 12px;border:1px solid var(--line);min-height:3.6em}
input[type=range]{width:100%;accent-color:var(--acc)}
.m{white-space:nowrap}
@media(max-width:480px){body{font-size:16px}.card{padding:14px;box-shadow:4px 4px 0 var(--acc)}}
</style></head><body><main><div class="card" id="app"></div></main>
<script>
const $=s=>document.querySelector(s),ol=s=>`<span class=ol>${s}</span>`,AB=`|${ol('AB')}|`;
const f=n=>String(Math.round(n*100)/100).replace('.',',').replace('-','−');
// ---------- Grafik-Helfer ----------
function plot(o,fn){const{x0,x1,y0,y1,s}=o,W=(x1-x0)*s,H=(y1-y0)*s,X=x=>(x-x0)*s,Y=y=>(y1-y)*s;let g='';
for(let i=Math.ceil(x0);i<=x1;i++){g+=`<line class=gr x1=${X(i)} y1=0 x2=${X(i)} y2="${H}"/>`;if(i&&i%(o.st||1)==0)g+=`<text class=tk x=${X(i)} y=${Y(0)+14}>${f(i)}</text>`}
for(let j=Math.ceil(y0);j<=y1;j++){g+=`<line class=gr x1=0 y1=${Y(j)} x2=${W} y2="${Y(j)}"/>`;if(j&&j%(o.st||1)==0)g+=`<text class=tk x=${X(0)-14} y=${Y(j)+4}>${f(j)}</text>`}
g+=`<line class=ax x1=0 y1=${Y(0)} x2=${W-4} y2="${Y(0)}"/><line class=ax x1=${X(0)} y1=${H} x2=${X(0)} y2="4"/><path d="M${W-2} ${Y(0)}l-9-4v8z M${X(0)} 2l-4 9h8z" fill="currentColor" style="color:var(--ink)"/><text class=lb x=${W-12} y=${Y(0)+26}>x</text><text class=lb x=${X(0)+10} y=14>y</text><text class=tk x=${X(0)-8} y=${Y(0)+14}>O</text>`;
return `<svg class=pl id="${o.id||''}" viewBox="0 0 ${W} ${H}" width="${W}" role=img aria-label="${o.al}">${g}${fn(X,Y)}</svg>`}
const P=(X,Y,x,y,t,dx=8,dy=-8,c='var(--ink)')=>`<circle cx=${X(x)} cy=${Y(y)} r=4.5 fill="${c}"/><text class=lb x=${X(x)+dx} y=${Y(y)+dy}>${t}</text>`;
const L=(X,Y,a,b,c,d,col='var(--acc)',w=2.5,da='')=>`<line x1=${X(a)} y1=${Y(b)} x2=${X(c)} y2=${Y(d)} stroke="${col}" stroke-width=${w} stroke-dasharray="${da}"/>`;
const G=(X,Y,x0,x1)=>L(X,Y,x0,.5*x0+3,x1,.5*x1+3,'var(--acc)',2)+`<text class=lb fill="var(--acc)" style="fill:var(--acc)" x=${X(x1)-18} y=${Y(.5*x1+3)-8}>g</text>`;
const tri=(X,Y,a)=>`<polygon points="${a.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="var(--acc)" fill-opacity=.12 stroke="var(--ink)" stroke-width="2"/>`;
const g1=()=>plot({x0:-3,x1:7,y0:-4,y1:2,s:36,al:'Strecke AB auf der Geraden y gleich minus 2'},(X,Y)=>L(X,Y,-1,-2,5,-2,'var(--ink)',3)+P(X,Y,-1,-2,'A(−1|−2)',-20,22)+P(X,Y,5,-2,'B(5|−2)',-24,22)+`<text class=lb x=${X(2)-30} y=${Y(-2)-10}>${AB} = ?</text>`);
const g2=(c)=>plot({x0:-3,x1:7,y0:-3,y1:7,s:32,al:'Gerade g, Punkte A und B'+(c?' sowie C1 und Höhe':'')},(X,Y)=>G(X,Y,-3,7)+L(X,Y,-1,-2,5,-2,'var(--ink)',3)+P(X,Y,-1,-2,'A',-16,18)+P(X,Y,5,-2,'B',6,18)+(c?tri(X,Y,[[-1,-2],[5,-2],[2,4]])+L(X,Y,2,4,2,-2,'var(--amb)',3,'6 4')+P(X,Y,2,4,'C₁(2|4)',8,-6,'var(--amb)')+P(X,Y,2,-2,'F₁',4,18)+`<text class=lb x=${X(2)+6} y=${Y(1)}>h₁</text>`:''));
const g3=()=>plot({x0:-3,x1:7,y0:-5,y1:7,s:30,al:'Dreieck ABC1 ohne achsenparallele Seite'},(X,Y)=>G(X,Y,-3,7)+tri(X,Y,[[-1,-2],[3,-4],[2,4]])+P(X,Y,-1,-2,'A(−1|−2)',-70,4)+P(X,Y,3,-4,'B(3|−4)',8,16)+P(X,Y,2,4,'C₁(2|4)',8,-6,'var(--amb)'));
// ---------- Dynamische Geometrie ----------
const app0={x0:-12,x1:8,y0:-4,y1:8,s:24};
const gApp=()=>plot({...app0,id:'ap',st:2,al:'Dynamische Zeichnung: C auf g verschiebbar'},(X,Y)=>G(X,Y,-12,8)+L(X,Y,-12,-2,8,-2,'var(--ink)',1,'5 4')+`<polygon id=tr fill="var(--acc)" fill-opacity=.15 stroke="var(--ink)" stroke-width=2 />`+L(X,Y,0,0,0,0,'var(--amb)',3,'6 4').replace('<line','<line id=hl')+P(X,Y,-1,-2,'A',-16,18)+P(X,Y,5,-2,'B',6,18)+`<circle id=cc r=11 fill="var(--amb)" stroke="var(--ink)" stroke-width=2 style="cursor:grab"/><text id=cl class=lb>C</text>`)+
`<div class=ro id=ro aria-live=polite></div><label class=meta>Regler für x: <input id=sl type=range min=-12 max=8 step=.5 value=2 aria-label="x-Koordinate von C"></label>`;
function mount(){const sc=24,W=480,ap=$('#ap'),X=x=>(x+12)*sc,Y=y=>(8-y)*sc;let dr=0;
function up(x){x=Math.max(-12,Math.min(8,Math.round(x*2)/2));const y=.5*x+3,h=y+2,xs=x<0?'('+f(x)+')':f(x);$('#sl').value=x;
$('#tr').setAttribute('points',`${X(-1)},${Y(-2)} ${X(5)},${Y(-2)} ${X(x)},${Y(y)}`);
const l=$('#hl');l.setAttribute('x1',X(x));l.setAttribute('y1',Y(y));l.setAttribute('x2',X(x));l.setAttribute('y2',Y(-2));
$('#cc').setAttribute('cx',X(x));$('#cc').setAttribute('cy',Y(y));$('#cl').setAttribute('x',X(x)+14);$('#cl').setAttribute('y',Y(y)-10);
$('#ro').innerHTML=`C<sub>n</sub>(${f(x)} | ${f(y)}) &nbsp; ${h>0?`h = [0,5 · ${xs} + 5] LE = ${f(h)} LE &nbsp; A = ½ · 6 LE · ${f(h)} LE = <b>${f(3*h)} FE</b>`:h==0?`h = 0 LE: C liegt auf der Geraden AB – <b>kein Dreieck</b>, A = 0 FE`:`C liegt <b>unterhalb</b> der Geraden AB (y − (−2) = ${f(h)} ist negativ) – die Differenz ist keine Länge mehr.`}`}
ap.addEventListener('pointerdown',e=>{dr=1;ap.setPointerCapture(e.pointerId);mv(e)});ap.addEventListener('pointerup',()=>dr=0);ap.addEventListener('pointermove',e=>dr&&mv(e));
function mv(e){const r=ap.getBoundingClientRect();up((e.clientX-r.left)/r.width*W/sc-12)}
$('#sl').oninput=e=>up(+e.target.value);up(2)}
// ---------- Lernschritte ----------
const O=(...a)=>a;
const S=[
{h:'Ein Punkt wandert',x:`Gegeben: A(−1|−2), B(5|−2) und die Gerade g mit y = 0,5x + 3. Der Punkt C<sub>n</sub>(x | 0,5x + 3) wandert auf g und bildet mit A und B die Dreiecke ABC<sub>n</sub>. <b>Ziehe C</b> mit Maus oder Finger (oder nutze den Regler) und beobachte die gestrichelte Höhe und den Flächeninhalt.`,g:gApp,m:1,
q:'Vergleiche x = 0 und x = 2 an deiner Zeichnung. Wie verändert sich die Höhe, wenn C um 2 nach rechts wandert?',
o:O('Sie wächst um 1 LE.','Sie bleibt gleich.','Sie wird kleiner.','Sie verdoppelt sich.'),c:0,
fb:[,'Probiere es aus: bei x = 0 ist h = 5 LE, bei x = 2 ist h = 6 LE. Gleich?','g steigt nach rechts. Beobachte, ob die gestrichelte Strecke länger oder kürzer wird.','Vergleiche die Werte: 5 LE und 6 LE – ist 6 das Doppelte von 5?'],
tip:'Lies h bei x = 0 und bei x = 2 an der Anzeige ab und bilde die Differenz.',
e:'Genau: Die Steigung 0,5 bedeutet „2 nach rechts, 1 nach oben“. Die Höhe hängt also gleichmäßig (linear) von x ab. Das ist eine <b>funktionale Abhängigkeit</b>: Wir suchen Terme h(x) und A(x), die für jeden Wert von x passen.'},
{h:'Die Grundseite',x:`A und B haben dieselbe y-Koordinate. Die Strecke ${ol('AB')} ist deshalb waagrecht, also parallel zur x-Achse. Länge: größerer minus kleinerer x-Wert.`,g:g1,
q:`Wie lang ist die Strecke ${ol('AB')}? Schreibe als Größe.`,
o:O(`${AB} = 4 LE`,`${AB} = 6 LE`,`${AB} = 6 FE`,`${AB} = 3 LE`),c:1,
fb:['Du hast 5 − 1 gerechnet. Achtung: x<sub>A</sub> ist −1, nicht 1.',,'Eine Länge hat die Einheit LE, FE ist für Flächeninhalte.','3 wäre der Abstand vom Mittelpunkt. Gesucht ist x<sub>rechts</sub> − x<sub>links</sub>.'],
tip:'Rechne 5 − (−1): Minus vor einer negativen Zahl wird zum Plus.',
e:`Richtig: ${AB} = [5 − (−1)] LE = 6 LE. Beachte die Schreibweise: ${ol('AB')} ist die Strecke, ${AB} ihre Länge.`},
{h:'Der wandernde Punkt',x:'Der Punkt C<sub>n</sub> liegt auf g: y = 0,5x + 3. Wir testen zuerst x = 2.',g:()=>g2(0),
q:'Welche Koordinaten hat C₁ für x = 2?',
o:O('C₁(2 | 3)','C₁(4 | 2)','C₁(2 | 4)','C₁(2 | 2)'),c:2,
fb:['Du hast nur den y-Achsenabschnitt 3 genommen. 0,5 · 2 fehlt noch.','Die Koordinaten sind vertauscht: erst x, dann y.',,'Setze x = 2 in y = 0,5x + 3 ein: 0,5 · 2 = ?'],
tip:'y = 0,5 · 2 + 3',e:'Richtig: y = 0,5 · 2 + 3 = 4, also C₁(2 | 4).'},
{h:'Die Höhe',x:'Die Höhe steht senkrecht auf der waagrechten Seite und verläuft deshalb parallel zur y-Achse. Ihr Fußpunkt ist F₁(2 | −2).',g:()=>g2(1),
q:'Wie lang ist die Höhe h₁ von C₁(2 | 4) zur Geraden AB?',
o:O('2 LE','4 LE','6 LE','6 FE'),c:2,
fb:['Du hast 4 + (−2) gerechnet. Gebraucht wird y<sub>oben</sub> − y<sub>unten</sub>.','4 ist nur die y-Koordinate von C₁. Gemessen wird bis zur Geraden AB, nicht bis zur x-Achse.',,'Eine Länge hat die Einheit LE.'],
tip:'Rechne y<sub>oben</sub> − y<sub>unten</sub> = 4 − (−2).',e:'Richtig: h₁ = [4 − (−2)] LE = 6 LE.'},
{h:'Verallgemeinern: h(x)',x:'Jetzt für jeden Punkt C<sub>n</sub>(x | 0,5x + 3): Setze die y-Koordinate von C<sub>n</sub> als Term an und ziehe y<sub>A</sub> = −2 ab. Achte auf die Klammer vor der Einheit.',
q:'Wie lautet der Höhenterm?',
o:O('h(x) = 0,5x + 5 LE','h(x) = [0,5x + 3] LE','h(x) = [0,5x + 1] LE','h(x) = [0,5x + 5] LE'),c:3,
fb:['Der Term stimmt, aber die Klammer fehlt: ohne sie gehört LE nur zur 5.','Du hast y<sub>A</sub> = −2 nicht abgezogen.','Du hast 3 + (−2) gerechnet. Es wird aber (−2) <i>abgezogen</i>.',],
tip:'h(x) = [(0,5x + 3) − (−2)] LE. Was wird aus „− (−2)“?',e:'Richtig: h(x) = [(0,5x + 3) − (−2)] LE = [0,5x + 5] LE. Kontrolle mit x = 2: 0,5 · 2 + 5 = 6 ✓ (wie in der Zeichnung).'},
{h:'Für welche x gilt das?',x:'Schiebe C im Applet nach links, auch über x = −10 hinaus, und lies die Anzeige. Der Term h(x) ist nur dann eine Länge, wenn C<sub>n</sub> über der Geraden AB liegt.',g:gApp,m:1,
q:'Welche Grundmenge ist sinnvoll?',
o:O('x ∈ ℝ','x ∈ ℝ; x > 0','x ∈ ℝ; x > −10','x ∈ ℝ; x > 10'),c:2,
fb:['Für x ≤ −10 liegt C auf oder unter AB. Probiere es im Applet.','Auch für x = −5 gibt es ein Dreieck: dort ist h = 2,5 LE.',,'Wo ist 0,5x + 5 gleich 0? Löse die Gleichung.'],
tip:'Bedingung: 0,5x + 3 > −2.',e:'Richtig: 0,5x + 3 > −2 ⇔ x > −10. Für x = −10 liegt C auf AB (h = 0, A = 0 FE). Schreibe daher h(x) = [0,5x + 5] LE mit x ∈ ℝ; x > −10.'},
{h:'Der Flächeninhalt',x:`Nun ${AB} = 6 LE und h(x) = [0,5x + 5] LE. Wir rechnen mit den Maßzahlen und setzen die Einheit ans Ende. Beim Dreieck gilt A = ½ · g · h.`,
q:'Berechne A(x) für die Dreiecke ABC<sub>n</sub>.',
o:O('A(x) = [3x + 30] FE','A(x) = [1,5x + 5] FE','A(x) = 1,5x + 15 FE','A(x) = [1,5x + 15] FE'),c:3,
fb:['Der Faktor ½ fehlt: ½ · 6 = 3, nicht 6.','Die 3 muss auch mit der 5 multipliziert werden (Distributivgesetz).','Zahlen stimmen, aber die Klammer vor FE fehlt.',],
tip:'A(x) = ½ · 6 · (0,5x + 5) FE = 3 · (0,5x + 5) FE',e:'Richtig: A(x) = ½ · 6 · (0,5x + 5) FE = [1,5x + 15] FE mit x ∈ ℝ; x > −10. Kontrolle mit x = 2: 18 FE, in der Zeichnung ½ · 6 · 6 = 18 ✓.'},
{h:'Rückwärts gefragt',x:'Das Dreieck ABC₂ soll einen Flächeninhalt von 24 FE haben. Setze A(x) = 24 und löse nach x auf.',
q:'Für welches x gilt das?',
o:O('x = 4','x = 6','x = 9','x = 10'),c:1,
fb:['Probe: A(4) = [1,5 · 4 + 15] FE = 21 FE.',,'Probe: A(9) = 28,5 FE.','Probe: A(10) = 30 FE.'],
tip:'1,5x + 15 = 24  | − 15',e:'Richtig: 1,5x = 9, also x = 6 und y = 0,5 · 6 + 3 = 6, d. h. <b>C₂(6 | 6)</b>. Probe: h = 8 LE, ½ · 6 · 8 = 24 ✓.'},
{h:'Schräge Seite: Pfeile',x:'Neues Dreieck: A(−1 | −2), B(3 | −4), C<sub>n</sub>(x | 0,5x + 3), x ∈ ℝ; x > −5,5. Keine Seite ist achsenparallel, Grundseite und Höhe lassen sich nicht ablesen. Hier hilft die <b>Determinante</b> aus den Pfeilen AB und AC. Ein Pfeil sagt, wie weit man nach rechts und nach oben geht: „Ziel minus Start“.',g:g3,
q:'Welche Koordinaten hat der Pfeil von A nach B?',
o:O('x-Koordinate 2, y-Koordinate −6','x-Koordinate −4, y-Koordinate 2','x-Koordinate 4, y-Koordinate −2','x-Koordinate 3, y-Koordinate −4'),c:2,
fb:['Das wäre eine Summe der Koordinaten. Es wird subtrahiert.','Das ist der Pfeil von B nach A: Start und Ziel sind vertauscht.',,'Das sind die Koordinaten des Punktes B. Von ihnen wird noch A abgezogen.'],
tip:'x: 3 − (−1), y: −4 − (−2)',e:'Richtig: (3 − (−1) | −4 − (−2)) = (4 | −2). Der Pfeil AC hat entsprechend die Koordinaten x + 1 und 0,5x + 5.'},
{h:'Schräge Seite: Determinante',x:'Die Pfeile stehen als Spalten in der Determinante. Rechenregel: (links oben · rechts unten) − (rechts oben · links unten). Für das Dreieck folgt A = ½ · [4 · (0,5x + 5) − (−2) · (x + 1)] FE.',
q:'Was ergibt A(x)?',
o:O('A(x) = [4x + 22] FE','A(x) = [2x + 20] FE','A(x) = [2x + 11] FE','A(x) = [9] FE'),c:2,
fb:['Der Faktor ½ beim Dreieck fehlt noch.','Du hast nur 4 · (0,5x + 5) gerechnet. Der zweite Summand fehlt.',,'Minus mal Minus gibt Plus: − (−2) · (x + 1) = + 2x + 2.'],
tip:'4 · (0,5x + 5) = 2x + 20 und −(−2) · (x + 1) = 2x + 2.',e:'Richtig: ½ · [2x + 20 + 2x + 2] FE = [2x + 11] FE. Kontrolle mit x = 2: Determinante 4 · 6 − (−2) · 3 = 30, also 15 FE, und 2 · 2 + 11 = 15 ✓. Für x > −5,5 liegt C<sub>n</sub> links der Richtung A → B, die Determinante ist positiv. Beim Parallelogramm entfällt der Faktor ½.'}
];
// ---------- Test ----------
const T=[
{p:'Wie schreibt man die <b>Länge</b> der Strecke AB nach dem Zeichenkatalog?',o:[`${ol('AB')}`,`[AB]`,AB,'AB'],c:2,e:`${ol('AB')} ist die Strecke, ${AB} ihre Länge.`},
{p:'A(1 | 1), B(7 | 1), C<sub>n</sub>(x | x + 2). Welche Höhe hat das Dreieck ABC<sub>n</sub>?',o:['h(x) = [x + 3] LE','h(x) = [x + 1] LE','h(x) = x + 1 LE','h(x) = [x − 1] LE'],c:1,e:'h(x) = [(x + 2) − 1] LE = [x + 1] LE. Die Klammer vor LE ist nötig.'},
{p:'Welche Grundmenge ist für diese Dreiecke sinnvoll? (Aufgabe zuvor)',o:['x ∈ ℝ; x > 1','x ∈ ℝ; x > −1','x ∈ ℝ; x > −3','x ∈ ℝ'],c:1,e:'C liegt über AB, wenn x + 2 > 1, also x > −1.'},
{p:'Welchen Flächeninhalt haben diese Dreiecke? (Grundseite 6 LE)',o:['A(x) = [6x + 6] FE','A(x) = [3x + 3] FE','A(x) = [x + 3] FE','A(x) = [3x + 1] FE'],c:1,e:'A(x) = ½ · 6 · (x + 1) FE = [3x + 3] FE.'},
{p:'Die Pfeile AB mit den Koordinaten 3 und 1 sowie AC mit 2 und 4 spannen das Dreieck ABC auf. Wie groß ist sein Flächeninhalt?',o:['10 FE','14 FE','5 FE','12 FE'],c:2,e:'Determinante: 3 · 4 − 2 · 1 = 10. Beim Dreieck wird halbiert: A = 5 FE (10 FE wäre das Parallelogramm).'},
{p:'Welche Aussage ist fachlich richtig?',o:['A = ½ · g · h gilt nur, wenn eine Seite achsenparallel ist.','Bei schrägen Seiten ist die Determinante der einzige Weg.','A = ½ · g · h gilt immer; ablesen kann man g und h aber nur bei achsenparalleler Seite direkt.','Beim Parallelogramm rechnet man mit dem Faktor ½.'],c:2,e:'Die Formeln gelten immer. Die Koordinaten liefern g und h direkt nur bei achsenparalleler Seite. Sonst nutzt man meist die Determinante, es gibt aber auch andere Wege (z. B. Ergänzen oder Zerlegen).'}
];
// ---------- Steuerung ----------
let i=0,w=0,ans=[];const N=S.length+T.length;
const head=n=>`<div class=meta>${n<S.length?`Schritt ${n+1} von ${S.length}`:`Test: Frage ${n-S.length+1} von ${T.length}`}</div><div class=bar><i style="width:${n/N*100}%"></i></div>`;
function show(){if(i>=N)return result();window.scrollTo(0,0);
if(i<S.length){const d=S[i];w=0;$('#app').innerHTML=head(i)+`<h2>${d.h}</h2><p>${d.x}</p>${d.g()}<div class=q>${d.q}</div><div id=os></div><div id=fb></div><button class=btn id=nx hidden>Weiter</button>`;
if(d.m)mount();
d.o.forEach((t,k)=>{const b=document.createElement('button');b.className='o';b.innerHTML=t;b.onclick=()=>{if(k==d.c){b.classList.add('ok');document.querySelectorAll('.o').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb g"><b>Richtig.</b> ${d.e}</div>`;$('#nx').hidden=false;$('#nx').focus()}else{w++;b.classList.add('bad');b.disabled=true;$('#fb').innerHTML=`<div class=fb><b>Noch nicht.</b> ${d.fb[k]}</div>`+(w>1?`<div class="fb tip"><b>Tipp:</b> ${d.tip}</div>`:'')}};$('#os').append(b)});
$('#nx').onclick=()=>{i++;show()}}
else{const k=i-S.length,d=T[k];$('#app').innerHTML=head(i)+`<h2>Abschlusstest</h2><div class=q>${d.p}</div><div id=os></div><button class=btn id=nx disabled>${k==T.length-1?'Auswerten':'Weiter'}</button>`;
d.o.forEach((t,j)=>{const b=document.createElement('button');b.className='o'+(ans[k]===j?' sel':'');b.innerHTML=t;b.onclick=()=>{ans[k]=j;document.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#nx').disabled=false};$('#os').append(b)});
$('#nx').disabled=ans[k]===undefined;$('#nx').onclick=()=>{i++;show()}}}
function result(){const s=T.filter((d,k)=>ans[k]===d.c).length;
$('#app').innerHTML=`<div class=bar><i style="width:100%"></i></div><h1>Ergebnis: ${s} von ${T.length} richtig</h1><p>${s==T.length?'Stark: Du beherrschst Höhe, Grundmenge, Flächeninhalt und Determinante.':s>=4?'Gut. Schau dir die markierten Aufgaben noch einmal an.':'Gehe die Schritte noch einmal durch, besonders Höhe, Klammer vor der Einheit und Grundmenge.'}</p>`+
T.map((d,k)=>{const ok=ans[k]===d.c;return `<div class="fb ${ok?'g':''}"><b>${k+1}. ${ok?'Richtig':'Falsch'}.</b> ${d.p}<br>${ok?'':`Deine Antwort: ${d.o[ans[k]]}<br>`}Richtig: ${d.o[d.c]}<br>${d.e}</div>`}).join('')+`<button class=btn id=rs>Noch einmal starten</button>`;
$('#rs').onclick=()=>{i=0;ans=[];show()}}
show();
</script></body></html>
